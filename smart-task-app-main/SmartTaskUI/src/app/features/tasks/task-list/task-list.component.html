<!-- Error Alert -->
<div *ngIf="error()" class="p-4 bg-red-500/10 border border-red-500/50 rounded-lg mb-4">
  <p class="text-red-400 text-sm flex items-center gap-2">
    <svg class="w-4 h-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4v.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
    </svg>
    {{ error() }}
  </p>
</div>

<!-- Loading State -->
<div *ngIf="isLoading()" class="p-12 flex justify-center">
  <svg class="animate-spin h-8 w-8 text-indigo-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
  </svg>
</div>

<!-- Empty State -->
<div *ngIf="!isLoading() && tasks().length === 0" class="p-12 text-center">
  <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-slate-800 border border-slate-700 mb-4">
    <svg class="w-8 h-8 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
    </svg>
  </div>
  <h3 class="text-lg font-medium text-white">No tasks found</h3>
  <p class="text-slate-400 mt-1">Get started by creating a new smart task.</p>
</div>

<!-- Task List -->
<ul *ngIf="!isLoading() && tasks().length > 0" class="divide-y divide-slate-700/50" [attr.aria-label]="'Task list with ' + tasks().length + ' items'">
  <li *ngFor="let task of tasks(); let i = index; trackBy: trackByTaskId"
      class="group p-4 hover:bg-slate-700/20 transition-all flex items-start gap-4"
      [class.opacity-50]="task.isCompleted"
      [attr.data-task-id]="task.id">
    
    <!-- Checkbox completion -->
    <button 
      (click)="toggleComplete(task.id)" 
      [attr.aria-label]="'Toggle completion for ' + task.title"
      class="mt-1 flex-shrink-0 focus:outline-none focus:ring-2 focus:ring-indigo-500 rounded">
      <div class="w-6 h-6 rounded border flex items-center justify-center transition-colors"
           [class.bg-emerald-500]="task.isCompleted" 
           [class.border-emerald-500]="task.isCompleted"
           [class.bg-transparent]="!task.isCompleted"
           [class.border-slate-500]="!task.isCompleted"
           [class.group-hover:border-indigo-400]="!task.isCompleted">
        <svg *ngIf="task.isCompleted" class="w-4 h-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7" />
        </svg>
      </div>
    </button>
    
    <div class="flex-1 min-w-0">
      <div class="flex items-center justify-between gap-2 mb-1">
        <h4 class="text-base font-medium text-slate-100 truncate transition-all line-clamp-1"
            [class.line-through]="task.isCompleted">
          {{ task.title }}
        </h4>
        
        <div class="flex items-center gap-3 flex-shrink-0">
          <!-- Smart Score -->
          <div class="flex flex-col items-end hidden sm:flex" [attr.title]="'Smart Prioritization Score: ' + task.smartScore">
            <span class="text-[10px] uppercase text-slate-500 font-bold tracking-wider">Score</span>
            <span [class]="getScoreColor(task.smartScore)">{{ task.smartScore }}</span>
          </div>
          
          <button 
            (click)="deleteTask(task.id)"
            [attr.aria-label]="'Delete ' + task.title"
            class="text-slate-500 hover:text-red-400 opacity-0 group-hover:opacity-100 transition-opacity p-1 focus:outline-none focus:ring-2 focus:ring-red-500 rounded">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
            </svg>
          </button>
        </div>
      </div>
      
      <p *ngIf="task.description" class="text-sm text-slate-400 line-clamp-2 mb-3">
        {{ task.description }}
      </p>
      
      <div class="flex flex-wrap gap-2 items-center text-xs">
        <span [class]="getEnergyColor(task.requiredEnergy)" class="px-2 py-0.5 rounded-full" [attr.aria-label]="'Energy level: ' + task.requiredEnergy">
          {{ task.requiredEnergy }} Energy
        </span>
        
        <span *ngIf="task.dueDate" 
              class="flex items-center gap-1 text-slate-400 bg-slate-800 px-2 py-0.5 rounded border border-slate-700"
              [attr.aria-label]="'Due date: ' + (task.dueDate | date:'mediumDate')">
          <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
          </svg>
          {{ task.dueDate | date:'mediumDate' }}
        </span>
        
        <span class="flex items-center gap-1 text-slate-400 bg-slate-800 px-2 py-0.5 rounded border border-slate-700"
              [attr.aria-label]="'Importance: ' + task.importance + ' out of 10'">
          <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z" />
          </svg>
          Impact: {{ task.importance }}/10
        </span>
      </div>
    </div>
  </li>
</ul>
