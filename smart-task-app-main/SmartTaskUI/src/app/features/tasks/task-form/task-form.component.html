<form (ngSubmit)="onSubmit()" class="space-y-5">
  
  <!-- Error Alert -->
  <div *ngIf="error()" class="p-3 bg-red-500/10 border border-red-500/50 rounded-lg">
    <p class="text-red-400 text-sm flex items-center gap-2">
      <svg class="w-4 h-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4v.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      {{ error() }}
    </p>
  </div>

  <div>
    <label for="title" class="block text-sm font-medium text-slate-300 mb-1">Task Title <span class="text-rose-400">*</span></label>
    <input 
      type="text" 
      id="title" 
      name="title" 
      [(ngModel)]="taskData.title"
      class="w-full px-4 py-2.5 rounded-lg bg-slate-900 border border-slate-700 text-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all placeholder-slate-500"
      placeholder="What needs to be done?"
      required>
  </div>

  <div>
    <label for="description" class="block text-sm font-medium text-slate-300 mb-1">Description</label>
    <textarea 
      id="description" 
      name="description" 
      [(ngModel)]="taskData.description"
      rows="3"
      class="w-full px-4 py-2.5 rounded-lg bg-slate-900 border border-slate-700 text-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all placeholder-slate-500 resize-none"
      placeholder="Add some details..."></textarea>
  </div>

  <div class="grid grid-cols-2 gap-4">
    <div>
      <label for="energy" class="block text-sm font-medium text-slate-300 mb-1">Required Energy</label>
      <select 
        id="energy" 
        name="requiredEnergy" 
        [(ngModel)]="taskData.requiredEnergy"
        class="w-full px-4 py-2.5 rounded-lg bg-slate-900 border border-slate-700 text-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all appearance-none cursor-pointer">
        <option value="High">High (Deep focus)</option>
        <option value="Medium">Medium (Normal)</option>
        <option value="Low">Low (Admin/Easy)</option>
      </select>
    </div>

    <div>
      <label for="dueDate" class="block text-sm font-medium text-slate-300 mb-1">Due Date</label>
      <input 
        type="date" 
        id="dueDate" 
        name="dueDate" 
        [(ngModel)]="taskData.dueDate"
        class="w-full px-4 py-2.5 rounded-lg bg-slate-900 border border-slate-700 text-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all cursor-pointer">
    </div>
  </div>

  <div>
    <div class="flex justify-between items-center mb-1">
      <label for="importance" class="block text-sm font-medium text-slate-300">Importance: {{ taskData.importance }}/10</label>
      <span class="text-xs text-slate-500">For Eisenhower Matrix</span>
    </div>
    <input 
      type="range" 
      id="importance" 
      name="importance" 
      min="1" max="10" 
      [(ngModel)]="taskData.importance"
      class="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-indigo-500">
  </div>

  <div class="pt-4 border-t border-slate-700/50 flex gap-3">
    <button 
      type="button"
      (click)="cancel()"
      class="w-full py-2.5 px-4 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg font-medium transition-colors">
      Cancel
    </button>
    <button 
      type="submit" 
      [disabled]="isSubmitting() || !taskData.title.trim()"
      class="w-full py-2.5 px-4 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg font-medium shadow-lg shadow-indigo-600/30 transition-all active:scale-[0.98] disabled:opacity-50 disabled:cursor-not-allowed flex justify-center items-center gap-2">
      <span *ngIf="!isSubmitting()">Add Smart Task</span>
      <svg *ngIf="isSubmitting()" class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
      </svg>
    </button>
  </div>
</form>
