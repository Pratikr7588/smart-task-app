<div class="min-h-screen bg-slate-900 flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-slate-800 rounded-2xl shadow-xl overflow-hidden shadow-indigo-500/10 border border-slate-700/50">
    <div class="px-8 pt-8 pb-6 bg-gradient-to-br from-indigo-900/40 to-slate-800">
      <h2 class="text-3xl font-bold text-white mb-2 tracking-tight">Welcome Back</h2>
      <p class="text-indigo-200">Sign in to organize your day.</p>
    </div>
    
    <div class="p-8 pt-6">
      <!-- Error Alert -->
      <div *ngIf="error()" class="mb-4 p-4 bg-red-500/10 border border-red-500/50 rounded-lg">
        <p class="text-red-400 text-sm flex items-center gap-2">
          <svg class="w-4 h-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4v.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
          {{ error() }}
        </p>
      </div>

      <form (ngSubmit)="onSubmit()" class="space-y-6">
        
        <div>
          <label for="email" class="block text-sm font-medium text-slate-300 mb-1">Email address</label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            [(ngModel)]="credentials.email"
            class="w-full px-4 py-3 rounded-lg bg-slate-900 border border-slate-700 text-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all placeholder-slate-500"
            placeholder="you@example.com"
            required>
        </div>

        <div>
          <label for="password" class="block text-sm font-medium text-slate-300 mb-1">Password</label>
          <input 
            type="password" 
            id="password" 
            name="password" 
            [(ngModel)]="credentials.password"
            class="w-full px-4 py-3 rounded-lg bg-slate-900 border border-slate-700 text-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all placeholder-slate-500"
            placeholder="••••••••"
            required>
        </div>

        <button 
          type="submit" 
          [disabled]="isLoading()"
          class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg font-medium shadow-lg shadow-indigo-600/30 transition-all active:scale-[0.98] disabled:opacity-70 disabled:cursor-not-allowed flex justify-center items-center gap-2">
          <span *ngIf="!isLoading()">Sign In</span>
          <svg *ngIf="isLoading()" class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
        </button>

      </form>

      <div class="mt-8 text-center">
        <p class="text-sm text-slate-400">
          Don't have an account? 
          <a routerLink="/register" class="text-indigo-400 hover:text-indigo-300 font-medium transition-colors">Create one</a>
        </p>
      </div>
    </div>
  </div>
</div>
